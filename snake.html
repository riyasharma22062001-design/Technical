<!DOCTYPE html>
<html>
<head>
    <title>Snake Game</title>
    <style>
        body { background: black; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: Arial; }
        canvas { border: 1px solid white; background: black; }
        
        #score { color: white; position: absolute; top: 10px; left: 10px; font-size: 20px; }
    </style>
</head>
<body>
    
    <div id="score">Score: 0</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <script>
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}];
        let food = {};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameOver = false;

        function randomFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
        }
        randomFood();

        document.addEventListener('keydown', changeDirection);
        function changeDirection(event) {
            const LEFT = 37, UP = 38, RIGHT = 39, DOWN = 40;
            const key = event.keyCode;
            if (key === LEFT && dx !== 1) { dx = -1; dy = 0; }
            else if (key === UP && dy !== 1) { dx = 0; dy = -1; }
            else if (key === RIGHT && dx !== -1) { dx = 1; dy = 0; }
            else if (key === DOWN && dy !== -1) { dx = 0; dy = 1; }
        }

        function drawGame() {
            
            // Move snake
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);

            // Eat food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = 'Score: ' + score;
                randomFood();
            } else {
                snake.pop();
            }

            // Collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount || snakeCollision(head)) {
                gameOver = true;
                ctx.fillStyle = 'white';
                ctx.font = '30px Arial';
                ctx.fillText('Game Over! Score: ' + score, 50, 200);
                return;
            }

            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Snake
            ctx.fillStyle = 'lime';
            snake.forEach(part => ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2));


            ctx.fillStyle = 'red';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function snakeCollision(head) {
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) return true;
            }
            return false;
        }

        const gameLoop = setInterval(() => {
            if (!gameOver) drawGame();
        }, 150);

        
        canvas.addEventListener('click', () => {
            if (gameOver) {
                snake = [{x: 10, y: 10}];
                dx = 0; dy = 0;
                score = 0;
                gameOver = false;
                document.getElementById('score').textContent = 'Score: 0';
                randomFood();
            }
        });
    </script>
</body>
</html>
